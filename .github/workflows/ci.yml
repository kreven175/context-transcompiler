name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 校验 JSON 数据文件
        run: |
          for f in schemas/*.json scripts/lexicon/*.json scripts/data/*.json; do
            python3 -c "import json,sys; json.load(open(sys.argv[1], encoding='utf-8'))" "$f" \
              || { echo "::error file=$f::JSON 解析失败"; exit 1; }
          done

      - name: 评分内核回归测试
        run: python3 evals/run_evals.py

      - name: 样例一致性检查
        run: python3 evals/build_examples.py --check

      - name: 校验已提交的样例输出
        run: |
          for f in examples/*/output.json; do
            python3 scripts/validate.py --file "$f" || exit 1
          done

      - name: 冒烟测试
        run: |
          python3 scripts/probe.py --text "这个方案回头再说吧" --audience de-business --format md > /dev/null
          python3 scripts/probe.py --list-audiences > /dev/null
          python3 scripts/render_report.py --file examples/01-workplace-hedged-rejection/output.json --format html > /dev/null
